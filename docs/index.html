<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e7a6e">
<title>RollingDay 滚滚日程</title>
<style>
body{margin:0;background:#111;color:#ddd;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:32px 20px}
main{max-width:520px;margin:0 auto}
h1{color:#7fd;font-size:24px;margin:0 0 8px}
p{color:#aaa;margin:0 0 16px}
a.btn{display:inline-block;background:#0e7a6e;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600}
a.btn:active{filter:brightness(1.1)}
ul{color:#9ab;padding-left:1.2em}
code{background:#1a1a1a;padding:2px 6px;border-radius:4px;color:#9cf}
.card{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:16px;margin:20px 0}
</style>
</head>
<body>
<main>
  <h1>滚滚日程 RollingDay</h1>
  <p>一行输入、自动滚动的个人日程。手机可添加到主屏幕，离线可用；数据只存在本机。</p>
  <p><a class="btn" href="app/">打开手机 PWA →</a></p>
  <div class="card">
    <strong style="color:#7fd">示例输入</strong>
    <ul>
      <li><code>周四-19:30-补DSP</code></li>
      <li><code>周五-08:00-09:45-高等数学</code></li>
      <li><code>今天-09:00-开会</code> / <code>明天-交作业</code></li>
    </ul>
  </div>
  <p style="font-size:13px;color:#666">完整说明见仓库 <a href="https://github.com/bolt2012-china/RollingDay">README</a>。原 gist 版网页在 <code>web/index.html</code>。</p>
</main>
</body>
</html>
