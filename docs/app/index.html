<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0e7a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="滚滚日程">
<meta name="description" content="一行输入、自动滚动的个人日程。数据仅存本机。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>滚滚日程 RollingDay</title>
<style>
:root {
  --bg: #111; --panel: #1b1b1b; --card: #1e1e1e; --border: #333;
  --text: #ddd; --muted: #888; --teal: #0e7a6e; --teal-bright: #2db4a0;
  --cur-bg: #14392f; --cur-border: #3e9; --danger: #e55; --warn: #eb5;
  --safe: env(safe-area-inset-bottom, 0px); --top: env(safe-area-inset-top, 0px);
  --action-w: 148px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; padding-top: var(--top);
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--teal-bright); }

#hd {
  flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 10px 12px 8px; z-index: 3;
}
.hd-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; color: #7fd; white-space: nowrap; }
.brand .clock { font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn {
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: #9ab;
}
.icon-btn:active { background: #222; }
#status { font-size: 13px; color: #9ab; margin-bottom: 8px; min-height: 1.2em; }
#status .now { color: #7fd; font-weight: 600; }
.add-row { display: flex; gap: 8px; align-items: stretch; }
#input {
  flex: 1; min-width: 0; background: #141414; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; outline: none;
}
#input:focus { border-color: var(--teal-bright); }
#input::placeholder { color: #666; }
#addBtn {
  flex: 0 0 auto; background: var(--teal); border: none; border-radius: 10px;
  padding: 0 16px; font-weight: 600; color: #fff; cursor: pointer;
}
#addBtn:active { filter: brightness(1.1); }
#hint { margin: 6px 2px 0; font-size: 12px; color: var(--warn); min-height: 1.2em; }
#hint.ok { color: var(--muted); }

#vp { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; touch-action: pan-y; }
#scrollHint { display: none; position: fixed; right: 10px; bottom: calc(34px + var(--safe)); z-index: 15; background: rgba(20,57,47,.92); color: #9fe; font-size: 11px; padding: 3px 8px; border-radius: 10px; pointer-events: none; }
.b { touch-action: pan-y; }
#c { padding: 4px 0 80px; }
h3 { margin: 14px 14px 6px; color: #8af; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }

.row {
  position: relative; margin: 4px 10px; border-radius: 10px; overflow: hidden;
  touch-action: pan-y;
}
.row-actions {
  position: absolute; inset: 0 0 0 auto; width: var(--action-w);
  display: flex; z-index: 0;
}
.row-actions button {
  flex: 1; border: none; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
}
.row-actions .act-edit { background: #2a6; }
.row-actions .act-del { background: #c33; }

.b {
  position: relative; z-index: 1; padding: 10px 12px; border-radius: 10px;
  background: var(--card); border-left: 3px solid #555; cursor: pointer;
  transition: transform .18s ease, background .15s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.b.dragging { transition: none; }
.b.cur { background: var(--cur-bg); border-color: var(--cur-border); box-shadow: 0 0 0 1px rgba(62,153,153,.25); }
/* darken instead of opacity so swipe buttons behind never show through */
.b.past { background: #161616; color: #6a6a6a; border-left-color: #333; }
.b.past .t, .b.done .t { color: #4f5a63; }
.b.done { background: #161616; color: #6a6a6a; border-left-color: #333; text-decoration: line-through; }
.b.todo { border-color: #eb5; }
.b .t { color: #9ab; font-size: 12px; margin-bottom: 2px; }
.b .title { word-break: break-word; }
.b .meta { float: right; font-size: 11px; color: var(--teal-bright); margin-left: 8px; }

#empty {
  margin: 48px 24px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7;
}
#empty code {
  display: block; margin: 8px auto; max-width: 280px; text-align: left;
  background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
  padding: 10px 12px; color: #9cf; font-size: 13px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

#ft {
  flex: 0 0 auto; font-size: 11px; color: #555;
  padding: 6px 12px calc(6px + var(--safe)); border-top: 1px solid #222;
  text-align: center; background: #0d0d0d;
}

.mask {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
  z-index: 20; align-items: flex-end; justify-content: center;
}
.mask.show { display: flex; }
.mask.center { align-items: center; padding: 20px; }
.sheet {
  width: 100%; max-width: 480px; background: #1c1c1c;
  border-radius: 16px 16px 0 0; padding: 8px 12px calc(12px + var(--safe));
  border-top: 1px solid #333; max-height: 90vh; overflow: auto;
}
.mask.center .sheet {
  border-radius: 14px; max-width: 360px; padding: 16px;
  border: 1px solid #333; max-height: 85vh;
}
.sheet h2 { margin: 0 0 12px; font-size: 17px; color: #7fd; }
.sheet p.note { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.sheet .preview { padding: 12px 8px 16px; border-bottom: 1px solid #2a2a2a; margin-bottom: 8px; }
.sheet .preview .t { color: #9ab; font-size: 12px; }
.sheet .preview .title { font-size: 16px; margin-top: 4px; }
.sheet-btn {
  display: block; width: 100%; text-align: center; padding: 14px; margin: 4px 0;
  border: none; border-radius: 12px; background: #2a2a2a; cursor: pointer; font-size: 16px;
}
.sheet-btn.primary { background: var(--teal); color: #fff; font-weight: 600; }
.sheet-btn.danger { color: var(--danger); }
.sheet-btn:active { filter: brightness(1.15); }

.form-row { margin-bottom: 10px; }
.form-row label { display: block; font-size: 12px; color: #9ab; margin-bottom: 4px; }
.form-row input, .form-row select {
  width: 100%; background: #141414; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; outline: none;
}
.form-row input:focus, .form-row select:focus { border-color: var(--teal-bright); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.settings-actions { display: flex; flex-direction: column; gap: 8px; }
.settings-actions button, .toggle-row {
  padding: 12px; border-radius: 10px; border: 1px solid #333; background: #2a2a2a; cursor: pointer;
}
.settings-actions button.danger { border-color: #633; color: #f88; }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: default;
}
.toggle-row span { font-size: 14px; }
.toggle-row small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.switch {
  position: relative; width: 44px; height: 26px; flex: 0 0 auto;
  background: #444; border-radius: 13px; border: none; cursor: pointer; padding: 0;
}
.switch.on { background: var(--teal); }
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  background: #fff; border-radius: 50%; transition: transform .15s;
}
.switch.on::after { transform: translateX(18px); }
#settings .close, #editSheet .close-link {
  margin-top: 12px; width: 100%; padding: 10px; border: none; border-radius: 10px;
  background: transparent; color: var(--muted); cursor: pointer;
}
.flash { animation: flashIn .6s ease; }
@keyframes flashIn { from { background: #1a4a3c; } to { background: var(--card); } }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--safe)); transform: translateX(-50%);
  background: #222; color: #ddd; border: 1px solid #444; border-radius: 20px;
  padding: 8px 14px; font-size: 13px; z-index: 50; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="hd">
  <div class="hd-row">
    <div class="brand">
      <h1>滚滚日程</h1>
      <span class="clock" id="clock"></span>
    </div>
    <button type="button" class="icon-btn" id="settingsBtn" aria-label="设置" title="设置">⚙</button>
  </div>
  <div id="status">现在：—</div>
  <div class="add-row">
    <input id="input" type="text" enterkeyhint="done" autocomplete="off" autocorrect="off"
      placeholder="周四-19:30-补DSP 或 今天-08:00-09:45-高等数学" aria-label="添加日程">

</div>

<div id="vp"><div id="c"></div></div>
<div id="ft">v5 · 数据仅存本机 · 离线可用 · 手指可上下滑动</div>

<!-- Quick actions (tap fallback) -->

      <div class="t" id="sheetTime"></div>

    </div>
    <button type="button" class="sheet-btn primary" id="sheetDone">标记完成</button>
    <button type="button" class="sheet-btn" id="sheetEdit">编辑</button>
    <button type="button" class="sheet-btn danger" id="sheetDel">删除</button>
    <button type="button" class="sheet-btn" id="sheetCancel">取消</button>
  </div>
</div>

<!-- Edit sheet -->
<div id="editMask" class="mask" role="dialog" aria-modal="true">
  <div id="editSheet" class="sheet">
    <h2 id="editHeading">编辑日程</h2>
    <div class="form-row">
      <label for="editWeekday">星期 / 日期</label>
      <select id="editWeekday"></select>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label for="editStart">开始</label>
        <input id="editStart" type="time" inputmode="numeric">
      </div>
      <div class="form-row">
        <label for="editEnd">结束（可选）</label>
        <input id="editEnd" type="time" inputmode="numeric">
      </div>
    </div>
    <div class="form-row">
      <label for="editTitle">标题</label>
      <input id="editTitle" type="text" maxlength="120" placeholder="事件名称">
    </div>
    <div class="form-row">
      <label for="editRemind">提前提醒</label>
      <select id="editRemind">
        <option value="-1">使用默认</option>
        <option value="0">不提醒</option>
        <option value="5">提前 5 分钟</option>
        <option value="10">提前 10 分钟</option>
        <option value="15">提前 15 分钟</option>
        <option value="30">提前 30 分钟</option>
      </select>
    </div>
    <button type="button" class="sheet-btn primary" id="editSave">保存</button>
    <button type="button" class="close-link" id="editCancel">取消</button>
  </div>
</div>

<!-- Settings -->
<div id="settingsMask" class="mask center" role="dialog" aria-modal="true">
  <div id="settings" class="sheet">
    <h2>设置</h2>
    <p class="note">日程只保存在本机。网页 PWA <strong>无法写入系统闹钟</strong>；提醒依赖浏览器通知，Android Chrome 较稳，iOS Safari/PWA 支持有限。</p>
    <div class="toggle-row">
      <div>
        <span>日程提醒</span>
        <small id="notifStatus">未开启通知权限</small>
      </div>
      <button type="button" class="switch" id="notifSwitch" aria-label="开关提醒"></button>
    </div>
    <div class="form-row" style="margin-top:10px">
      <label for="defaultRemind">默认提前（分钟）</label>
      <select id="defaultRemind">
        <option value="0">不提醒</option>
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
        <option value="30">30</option>
      </select>
    </div>
    <div class="settings-actions" style="margin-top:8px">
      <button type="button" id="btnTestNotif">发送测试通知</button>
      <button type="button" id="btnExport">导出 JSON</button>
      <button type="button" id="btnImport">导入 JSON</button>
      <button type="button" class="danger" id="btnClear">清空全部数据…</button>
    </div>
    <button type="button" class="close" id="settingsClose">关闭</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<script>
/* RollingDay auto-scroll: native scrolling + pause on interaction, resume after idle */
function rdAutoScroll(vp, opts) {
  opts = opts || {};
  var step = opts.step || 0.5;
  var idleMs = opts.idleMs || 5000;
  var hintEl = opts.hintEl || null;
  var blocked = opts.blocked || function () { return false; };
  var pos = vp.scrollTop;
  var lastSet = -1;
  var pausedUntil = 0;
  var wasPaused = false;
  function showHint(on) {
    if (!hintEl) return;
    hintEl.style.display = on ? "block" : "none";
  }
  function pause() {
    pausedUntil = Date.now() + idleMs;
    if (!wasPaused) { wasPaused = true; showHint(true); }
  }
  var evs = ["touchstart", "touchmove", "wheel", "pointerdown", "mousedown", "keydown"];
  for (var i = 0; i < evs.length; i++) {
    vp.addEventListener(evs[i], pause, { passive: true });
  }
  vp.addEventListener("scroll", function () {
    // Ignore scroll events caused by our own scrollTop writes
    if (Math.abs(vp.scrollTop - lastSet) <= 2) return;
    pause();
  }, { passive: true });
  setInterval(function () {
    if (Date.now() < pausedUntil || blocked()) return;
    if (wasPaused) {
      wasPaused = false;
      showHint(false);
      pos = vp.scrollTop; // resume from where the user left it
    }
    var max = vp.scrollHeight - vp.clientHeight;
    if (max <= 0) { pos = 0; return; }
    pos += step;
    if (pos > max + 60) pos = -120;
    vp.scrollTop = Math.max(0, pos);
    lastSet = vp.scrollTop;
  }, 40);
  return { pause: pause };
}

(function () {
  "use strict";

  const LS_KEY = "rollingday.pwa.v1";
  const LS_SETTINGS = "rollingday.pwa.settings.v1";
  const TZ = "Asia/Shanghai";
  const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const WEEKDAY_ALIASES = {
    "周日": 0, "星期日": 0, "周天": 0, "星期天": 0, "日": 0,
    "周一": 1, "星期一": 1, "一": 1,
    "周二": 2, "星期二": 2, "二": 2,
    "周三": 3, "星期三": 3, "三": 3,
    "周四": 4, "星期四": 4, "四": 4,
    "周五": 5, "星期五": 5, "五": 5,
    "周六": 6, "星期六": 6, "六": 6,
    "今天": "today", "今日": "today",
    "明天": "tomorrow", "明日": "tomorrow"
  };
  const REMIND_OPTS = [0, 5, 10, 15, 30];
  const MISS_WINDOW_MS = 30 * 60 * 1000;
  const ACTION_W = 148;

  let store = loadStore();
  let settings = loadSettings();
  let scrollPos = 0;
  let paused = false;
  let selectedId = null;
  let editingId = null;
  let flashId = null;
  let openSwipeId = null;
  const localTimers = new Map();
  let swReg = null;

  const $ = (id) => document.getElementById(id);
  const input = $("input");
  const hint = $("hint");
  const c = $("c");
  const vp = $("vp");

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function loadStore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return { items: [], updatedAt: "" };
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.items)) return { items: [], updatedAt: "" };
      return { items: data.items, updatedAt: data.updatedAt || "" };
    } catch (e) {
      return { items: [], updatedAt: "" };
    }
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(LS_SETTINGS);
      const d = raw ? JSON.parse(raw) : {};
      return {
        remindersEnabled: !!d.remindersEnabled,
        defaultRemindMin: REMIND_OPTS.includes(+d.defaultRemindMin) ? +d.defaultRemindMin : 10
      };
    } catch (e) {
      return { remindersEnabled: false, defaultRemindMin: 10 };
    }
  }

  function saveSettings() {
    localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
  }

  function saveStore() {
    store.updatedAt = new Date().toISOString();
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
    syncReminders();
  }

  function nowParts() {
    const p = {};
    const fmt = new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    });
    for (const x of fmt.formatToParts(new Date())) p[x.type] = x.value;
    const wdFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" });
    const map = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    return {
      date: p.year + "-" + p.month + "-" + p.day,
      hm: p.hour + ":" + p.minute,
      weekday: map[wdFmt.format(new Date())] || 0,
      year: +p.year
    };
  }

  function addDays(dateStr, days) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.getUTCFullYear() + "-" + String(dt.getUTCMonth() + 1).padStart(2, "0") + "-" + String(dt.getUTCDate()).padStart(2, "0");
  }

  function weekdayOf(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  }

  function labelFor(dateStr) {
    const parts = dateStr.split("-");
    return (+parts[1]) + "/" + (+parts[2]) + " " + WEEKDAYS[weekdayOf(dateStr)];
  }

  function normalizeTime(t) {
    const m = String(t || "").trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h < 0 || h > 23 || mi < 0 || mi > 59) return null;
    return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
  }

  function parseLine(raw) {
    const line = String(raw || "").trim();
    if (!line) return { ok: false, error: "请输入内容，例如：周四-19:30-补DSP" };
    if (!line.includes("-") && !line.includes("－") && !line.includes("—")) {
      return { ok: true, item: makeItem({ kind: "todo", date: nowParts().date, title: line }) };
    }
    const parts = line.split(/[-－—]/).map((s) => s.trim()).filter((s) => s.length > 0);
    if (parts.length < 2) {
      return { ok: false, error: "格式不对。试试：周四-19:30-补DSP 或 周五-08:00-09:45-高等数学" };
    }
    const now = nowParts();
    let date = now.date;
    let idx = 0;
    const dayToken = parts[0];
    const alias = WEEKDAY_ALIASES[dayToken];
    if (alias === "today") { date = now.date; idx = 1; }
    else if (alias === "tomorrow") { date = addDays(now.date, 1); idx = 1; }
    else if (typeof alias === "number") {
      date = addDays(now.date, (alias - now.weekday + 7) % 7); idx = 1;
    } else if (/^\d{1,2}[/.-]\d{1,2}$/.test(dayToken)) {
      const md = dayToken.split(/[/.-]/);
      date = now.year + "-" + String(+md[0]).padStart(2, "0") + "-" + String(+md[1]).padStart(2, "0");
      idx = 1;
    } else { idx = 0; date = now.date; }

    if (idx >= parts.length) return { ok: false, error: "缺少事件内容。例如：周四-19:30-补DSP" };

    function looksLikeTime(s) { return /^\d{1,2}:\d{2}$/.test(String(s || "").trim()); }
    if (looksLikeTime(parts[idx])) {
      const t1 = normalizeTime(parts[idx]);
      if (!t1) return { ok: false, error: "时间无效，请用 0–23 点，例如 19:30 或 08:00" };
      idx += 1;
      let t2 = "";
      if (idx < parts.length && looksLikeTime(parts[idx])) {
        t2 = normalizeTime(parts[idx]);
        if (!t2) return { ok: false, error: "结束时间无效，请用 0–23 点，例如 09:45" };
        idx += 1;
      }
      const title = parts.slice(idx).join("-").trim();
      if (!title) return { ok: false, error: "缺少事件标题。例如：周四-19:30-补DSP" };
      if (t2 && t2 <= t1) return { ok: false, error: "结束时间应晚于开始时间" };
      return { ok: true, item: makeItem({ kind: "block", date, start: t1, end: t2, title }) };
    }

    const title = parts.slice(idx).join("-").trim();
    if (!title) return { ok: false, error: "缺少内容。无时间的行会当作待办，例如：明天-交作业" };
    if (idx === 0) {
      return { ok: true, item: makeItem({ kind: "todo", date: now.date, title: line }) };
    }
    return { ok: true, item: makeItem({ kind: "todo", date, title }) };
  }

  function makeItem(partial) {
    return {
      id: partial.id || uid(),
      kind: partial.kind === "todo" ? "todo" : "block",
      date: partial.date || nowParts().date,
      start: partial.start || "",
      end: partial.end || "",
      title: partial.title || "未命名",
      done: !!partial.done,
      remindBefore: partial.remindBefore == null ? null : partial.remindBefore,
      createdAt: partial.createdAt || new Date().toISOString()
    };
  }

  window.__rollingdayParse = parseLine;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function effectiveRemind(it) {
    if (!settings.remindersEnabled) return 0;
    if (it.remindBefore === 0) return 0;
    if (it.remindBefore == null || it.remindBefore < 0) return settings.defaultRemindMin;
    return +it.remindBefore;
  }

  /** Asia/Shanghai wall time → epoch ms */
  function shanghaiToEpoch(dateStr, hm) {
    // Interpret as UTC+8 fixed offset
    const [y, m, d] = dateStr.split("-").map(Number);
    const [hh, mm] = hm.split(":").map(Number);
    return Date.UTC(y, m - 1, d, hh - 8, mm, 0);
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function groupItems() {
    const map = new Map();
    for (const it of store.items) {
      if (!map.has(it.date)) map.set(it.date, []);
      map.get(it.date).push(it);
    }
    for (const [, list] of map) {
      list.sort((a, b) => {
        if (a.kind !== b.kind) return a.kind === "block" ? -1 : 1;
        if (a.start && b.start) return a.start < b.start ? -1 : a.start > b.start ? 1 : 0;
        if (a.start) return -1;
        if (b.start) return 1;
        return (a.createdAt || "").localeCompare(b.createdAt || "");
      });
    }
    return [...map.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
  }

  function closeAllSwipes(exceptId) {
    c.querySelectorAll(".b").forEach((el) => {
      const id = el.getAttribute("data-id");
      if (exceptId && id === exceptId) return;
      el.style.transform = "";
      el.classList.remove("open");
    });
    if (!exceptId || openSwipeId !== exceptId) openSwipeId = exceptId || null;
  }

  function render() {
    const now = nowParts();
    $("clock").textContent = now.date.slice(5) + " " + WEEKDAYS[now.weekday] + " " + now.hm;

    const groups = groupItems();
    let html = "";
    let cur = null;
    let nxt = null;

    if (!store.items.length) {
      c.innerHTML = `<div id="empty">还没有日程。在上方输入一行后按回车：
        <code>周四-19:30-补DSP
周五-08:00-09:45-高等数学
今天-09:00-开会
明天-交作业
买菜</code>
        左滑可编辑/删除，长按编辑，轻点标记完成。数据只存在本机。</div>`;
      $("status").innerHTML = "现在：空闲 · 添加第一条吧";
      return;
    }

    for (const [date, items] of groups) {
      if (date < addDays(now.date, -1)) continue;
      html += "<h3>" + esc(labelFor(date)) + "</h3>";
      for (const it of items) {
        const isBlock = it.kind === "block";
        let cls = "b" + (isBlock ? "" : " todo");
        if (it.done) cls += " done";
        if (isBlock && date === now.date && it.start) {
          const end = it.end || "23:59";
          if (it.start <= now.hm && now.hm < end) {
            cls += " cur";
            if (!it.done) cur = it;
          } else if (end <= now.hm || it.done) {
            cls += " past";
          } else if (!nxt && !it.done) {
            nxt = it;
          }
        } else if (date < now.date) {
          cls += " past";
        } else if (!cur && !nxt && isBlock && !it.done && date >= now.date) {
          nxt = it;
        }
        if (it.id === flashId) cls += " flash";

        const remind = effectiveRemind(it);
        const badges = [];
        if (it.done) badges.push("已完成");
        if (isBlock && settings.remindersEnabled && remind > 0) badges.push("提前提醒 " + remind + "′");

        const timeLabel = isBlock
          ? esc(it.start) + (it.end ? "–" + esc(it.end) : "")
          : (it.date === now.date ? "待办 · 今天" : "待办 · " + esc(labelFor(it.date)));

        const openX = openSwipeId === it.id ? -ACTION_W : 0;
        html += '<div class="row" data-row="' + esc(it.id) + '">' +
          '<div class="row-actions">' +
          '<button type="button" class="act-edit" data-act="edit" data-id="' + esc(it.id) + '">编辑</button>' +
          '<button type="button" class="act-del" data-act="del" data-id="' + esc(it.id) + '">删除</button>' +
          "</div>" +
          '<div class="' + cls + '" data-id="' + esc(it.id) + '" style="transform:translateX(' + openX + 'px)">' +
          (badges.length ? '<span class="meta">' + esc(badges.join(" · ")) + "</span>" : "") +
          '<div class="t">' + timeLabel + "</div>" +
          '<div class="title">' + esc(it.title) + "</div></div></div>";
      }
    }

    if (!html) {
      html = '<div id="empty">近期没有日程。试试添加：<code>今天-19:30-复盘</code></div>';
    }
    c.innerHTML = html;
    flashId = null;

    if (cur) {
      $("status").innerHTML = '<span class="now">现在：' + esc(cur.title) + (cur.end ? "（至 " + esc(cur.end) + "）" : "") + "</span>";
    } else {
      $("status").textContent = nxt
        ? "现在：空闲 · 下一项 " + (nxt.start || "") + " " + nxt.title
        : "现在：空闲";
    }
  }

  function addFromInput() {
    const result = parseLine(input.value);
    if (!result.ok) {
      hint.className = "";
      hint.textContent = result.error;
      input.focus();
      return;
    }
    store.items.push(result.item);
    saveStore();
    flashId = result.item.id;
    input.value = "";
    hint.className = "ok";
    hint.textContent = "已添加 · " + (result.item.kind === "todo" ? "待办" : "日程") + " · " + labelFor(result.item.date);
    render();
    setTimeout(() => {
      const el = c.querySelector('[data-id="' + result.item.id + '"]');
      if (el) {
        scrollPos = Math.max(0, el.offsetTop - 40);
        vp.scrollTop = scrollPos;
      }
    }, 50);
  }

  function findItem(id) {
    return store.items.find((x) => x.id === id);
  }

  function toggleDone(id) {
    const it = findItem(id);
    if (!it) return;
    it.done = !it.done;
    saveStore();
    render();
    toast(it.done ? "已完成" : "已标为未完成");
  }

  function deleteItem(id, confirmFirst) {
    const it = findItem(id);
    if (!it) return;
    if (confirmFirst && !confirm("确定删除「" + it.title + "」？")) return;
    store.items = store.items.filter((x) => x.id !== id);
    if (openSwipeId === id) openSwipeId = null;
    saveStore();
    render();
    toast("已删除");
  }

  function fillWeekdaySelect(selectedDate) {
    const sel = $("editWeekday");
    const now = nowParts();
    sel.innerHTML = "";
    for (let i = 0; i < 14; i++) {
      const d = addDays(now.date, i);
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = (i === 0 ? "今天 · " : i === 1 ? "明天 · " : "") + labelFor(d);
      if (d === selectedDate) opt.selected = true;
      sel.appendChild(opt);
    }
    if (selectedDate && ![...sel.options].some((o) => o.value === selectedDate)) {
      const opt = document.createElement("option");
      opt.value = selectedDate;
      opt.textContent = labelFor(selectedDate);
      opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function openEdit(id) {
    const it = findItem(id);
    if (!it) return;
    editingId = id;
    closeAllSwipes();
    closeSheet();
    $("editHeading").textContent = "编辑日程";
    fillWeekdaySelect(it.date);
    $("editStart").value = it.start || "";
    $("editEnd").value = it.end || "";
    $("editTitle").value = it.title || "";
    const rb = it.remindBefore;
    $("editRemind").value = rb == null ? "-1" : String(rb);
    $("editMask").classList.add("show");
  }

  function closeEdit() {
    editingId = null;
    $("editMask").classList.remove("show");
  }

  function saveEdit() {
    const it = findItem(editingId);
    if (!it) { closeEdit(); return; }
    const title = $("editTitle").value.trim();
    if (!title) { toast("请填写标题"); return; }
    const start = $("editStart").value;
    const end = $("editEnd").value;
    if (start && end && end <= start) { toast("结束时间应晚于开始时间"); return; }
    it.date = $("editWeekday").value;
    it.title = title;
    if (start) {
      it.kind = "block";
      it.start = start;
      it.end = end || "";
    } else {
      it.kind = "todo";
      it.start = "";
      it.end = "";
    }
    const rv = +$("editRemind").value;
    it.remindBefore = rv < 0 ? null : rv;
    saveStore();
    flashId = it.id;
    closeEdit();
    render();
    toast("已保存");
  }

  function openSheet(id) {
    const it = findItem(id);
    if (!it) return;
    selectedId = id;
    $("sheetTime").textContent = it.kind === "block"
      ? labelFor(it.date) + " " + it.start + (it.end ? "–" + it.end : "")
      : labelFor(it.date) + " · 待办";
    $("sheetTitle").textContent = it.title;
    $("sheetDone").textContent = it.done ? "标为未完成" : "标记完成";
    $("sheetMask").classList.add("show");
  }

  function closeSheet() {
    selectedId = null;
    $("sheetMask").classList.remove("show");
  }

  /* ---------- Reminders ---------- */
  function postToSw(msg) {
    return new Promise((resolve) => {
      if (!swReg || !swReg.active) { resolve({ ok: false, error: "no-sw" }); return; }
      const ch = new MessageChannel();
      ch.port1.onmessage = (e) => resolve(e.data || {});
      swReg.active.postMessage(msg, [ch.port2]);
      setTimeout(() => resolve({ ok: false, error: "timeout" }), 4000);
    });
  }

  function buildReminderRows() {
    if (!settings.remindersEnabled || notifPerm() !== "granted") return [];
    const rows = [];
    const now = Date.now();
    for (const it of store.items) {
      if (it.done || it.kind !== "block" || !it.start) continue;
      const mins = effectiveRemind(it);
      if (!mins || mins <= 0) continue;
      const startMs = shanghaiToEpoch(it.date, it.start);
      const fireAt = startMs - mins * 60 * 1000;
      if (fireAt + MISS_WINDOW_MS < now) continue; // too old
      rows.push({
        id: it.id,
        fireAt,
        title: "即将开始：" + it.title,
        body: labelFor(it.date) + " " + it.start + (it.end ? "–" + it.end : "") + " · 提前 " + mins + " 分钟",
        startAt: startMs
      });
    }
    return rows;
  }

  function clearLocalTimers() {
    for (const t of localTimers.values()) clearTimeout(t);
    localTimers.clear();
  }

  function armLocalTimers(rows) {
    clearLocalTimers();
    const now = Date.now();
    for (const row of rows) {
      const delay = row.fireAt - now;
      if (delay > 8 * 60 * 60 * 1000) continue; // only arm near-term locally
      if (delay <= 0) continue;
      const tid = setTimeout(() => {
        if (notifPerm() === "granted") {
          try {
            new Notification(row.title, {
              body: row.body,
              tag: "rd-" + row.id,
              icon: "./icons/icon-192.png"
            });
          } catch (e) {
            if (swReg) swReg.showNotification(row.title, { body: row.body, tag: "rd-" + row.id, icon: "./icons/icon-192.png" });
          }
        }
        localTimers.delete(row.id);
      }, delay);
      localTimers.set(row.id, tid);
    }
  }

  function notifPerm() {
    try { return ("Notification" in window) ? Notification.permission : "unsupported"; }
    catch (e) { return "unsupported"; }
  }
  async function syncReminders() {
    try {
      const rows = buildReminderRows();
      armLocalTimers(rows);
      if (swReg && typeof MessageChannel === "function") {
        await postToSw({ type: "sync-reminders", reminders: rows });
        await postToSw({ type: "check-due", maxMissedMs: MISS_WINDOW_MS });
      }
    } catch (e) { /* reminders must never break UI */ }
  }

  async function requestNotifPermission() {
    if (!("Notification" in window)) {
      toast("当前浏览器不支持通知");
      return false;
    }
    if (Notification.permission === "granted") return true;
    if (Notification.permission === "denied") {
      toast("通知已被拒绝，请在系统设置中开启");
      return false;
    }
    const ok = confirm("开启日程提醒？\n\n将在开始前通过浏览器通知提醒你。\n无法写入系统闹钟；iOS 上能力有限，Android Chrome 更稳。");
    if (!ok) return false;
    const perm = await Notification.requestPermission();
    return perm === "granted";
  }

  function updateNotifUI() {
    const sw = $("notifSwitch");
    const st = $("notifStatus");
    const on = settings.remindersEnabled && notifPerm() === "granted";
    sw.classList.toggle("on", on);
    $("defaultRemind").value = String(settings.defaultRemindMin);
    if (!("Notification" in window)) {
      st.textContent = "浏览器不支持通知";
    } else if (notifPerm() === "denied") {
      st.textContent = "系统已拒绝通知权限";
    } else if (on) {
      st.textContent = "已开启 · 默认提前 " + settings.defaultRemindMin + " 分钟";
    } else if (settings.remindersEnabled) {
      st.textContent = "已勾选但尚未授予权限";
    } else {
      st.textContent = "未开启（无法写入系统闹钟）";
    }
  }

  /* ---------- Gestures: swipe / long-press / tap ---------- */
  const gesture = {
    id: null,
    startX: 0,
    startY: 0,
    dx: 0,
    dy: 0,
    moved: false,
    swiping: false,
    longTimer: null,
    longFired: false,
    el: null,
    baseX: 0
  };

  function ptX(e) {
    if (typeof e.clientX === "number") return e.clientX;
    return (e.touches && e.touches[0]) ? e.touches[0].clientX : 0;
  }
  function ptY(e) {
    if (typeof e.clientY === "number") return e.clientY;
    return (e.touches && e.touches[0]) ? e.touches[0].clientY : 0;
  }
  function cardFromTouch(target) {
    return target && target.closest ? target.closest(".b") : null;
  }

  function onPointerDown(e) {
    const card = cardFromTouch(e.target);
    if (!card) return;
    if (e.target.closest && e.target.closest(".row-actions")) return;
    const id = card.getAttribute("data-id");
    gesture.id = id;
    gesture.el = card;
    gesture.startX = ptX(e);
    gesture.startY = ptY(e);
    gesture.dx = 0;
    gesture.dy = 0;
    gesture.moved = false;
    gesture.swiping = false;
    gesture.longFired = false;
    gesture.baseX = openSwipeId === id ? -ACTION_W : 0;
    card.classList.add("dragging");
    clearTimeout(gesture.longTimer);
    gesture.longTimer = setTimeout(() => {
      if (gesture.moved || gesture.swiping) return;
      gesture.longFired = true;
      lastLongFireAt = Date.now();
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
      openEdit(id);
    }, 480);
  }

  function onPointerMove(e) {
    if (!gesture.el) return;
    const x = ptX(e);
    const y = ptY(e);
    gesture.dx = x - gesture.startX;
    gesture.dy = y - gesture.startY;
    var adx = Math.abs(gesture.dx), ady = Math.abs(gesture.dy);
    if (!gesture.moved && (adx > 8 || ady > 8)) {
      gesture.moved = true;
      clearTimeout(gesture.longTimer);
    }
    if (!gesture.swiping && ady > 10 && ady >= adx) {
      // Vertical: hand over to native scrolling, never claim this gesture
      gesture.el.classList.remove("dragging");
      gesture.el = null;
      return;
    }
    if (!gesture.swiping && adx > 10 && adx > ady * 1.5) {
      gesture.swiping = true;
      if (openSwipeId && openSwipeId !== gesture.id) closeAllSwipes(gesture.id);
    }
    if (gesture.swiping) {
      let tx = gesture.baseX + gesture.dx;
      if (tx > 0) tx = 0;
      if (tx < -ACTION_W) tx = -ACTION_W;
      gesture.el.style.transform = "translateX(" + tx + "px)";
      if (e.cancelable) e.preventDefault();
    }
  }

  function onPointerUp() {
    clearTimeout(gesture.longTimer);
    if (!gesture.el) return;
    const el = gesture.el;
    const id = gesture.id;
    el.classList.remove("dragging");
    if (gesture.longFired) {
      gesture.el = null;
      return;
    }
    if (gesture.swiping) {
      const tx = gesture.baseX + gesture.dx;
      const open = tx < -ACTION_W / 2;
      el.style.transform = open ? "translateX(-" + ACTION_W + "px)" : "";
      openSwipeId = open ? id : (openSwipeId === id ? null : openSwipeId);
      gesture.el = null;
      return;
    }
    if (!gesture.moved) {
      // Tap: if swipe open, close; else toggle done
      if (openSwipeId === id) {
        closeAllSwipes();
        render();
      } else {
        closeAllSwipes();
        toggleDone(id);
      }
    }
    gesture.el = null;
  }

  var lastLongFireAt = 0;
  // Cancel the click the browser synthesizes after a long-press touch, so it
  // cannot land on the freshly opened edit sheet's backdrop and close it.
  c.addEventListener("touchend", function (e) {
    if (lastLongFireAt && Date.now() - lastLongFireAt < 5000) {
      lastLongFireAt = 0;
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });
  c.addEventListener("contextmenu", function (e) {
    if (e.target.closest && e.target.closest(".b")) e.preventDefault();
  });
  function onPointerCancel() {
    clearTimeout(gesture.longTimer);
    if (gesture.el) {
      gesture.el.classList.remove("dragging");
      if (gesture.swiping) gesture.el.style.transform = openSwipeId === gesture.id ? "translateX(-" + ACTION_W + "px)" : "";
    }
    gesture.el = null;
  }

  if (window.PointerEvent) {
    c.addEventListener("pointerdown", onPointerDown);
    c.addEventListener("pointermove", onPointerMove);
    c.addEventListener("pointerup", onPointerUp);
    c.addEventListener("pointercancel", onPointerCancel);
  } else {
    var lastTouch = 0;
    var touchWrap = function (fn) { return function (e) { lastTouch = Date.now(); fn(e); }; };
    var mouseWrap = function (fn) { return function (e) { if (Date.now() - lastTouch < 800) return; fn(e); }; };
    c.addEventListener("touchstart", touchWrap(onPointerDown), { passive: true });
    c.addEventListener("touchmove", touchWrap(onPointerMove), { passive: false });
    c.addEventListener("touchend", touchWrap(onPointerUp));
    c.addEventListener("touchcancel", touchWrap(onPointerCancel));
    c.addEventListener("mousedown", mouseWrap(onPointerDown));
    c.addEventListener("mousemove", mouseWrap(onPointerMove));
    c.addEventListener("mouseup", mouseWrap(onPointerUp));
  }
  c.addEventListener("touchmove", (e) => {
    if (gesture.swiping && e.cancelable) e.preventDefault();
  }, { passive: false });

  c.addEventListener("click", (e) => {
    const act = e.target.closest && e.target.closest("[data-act]");
    if (act) {
      e.preventDefault();
      e.stopPropagation();
      const id = act.getAttribute("data-id");
      const kind = act.getAttribute("data-act");
      if (kind === "edit") openEdit(id);
      else if (kind === "del") deleteItem(id, true);
      return;
    }
    if (!e.target.closest(".b") && !e.target.closest(".row-actions")) {
      if (openSwipeId) { closeAllSwipes(); render(); return; }
    }
  });

  /* ---------- UI wiring ---------- */
  $("addBtn").addEventListener("click", addFromInput);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addFromInput(); }
  });
  input.addEventListener("input", () => {
    hint.className = "ok";
    hint.textContent = "左滑删除/编辑 · 长按编辑 · 轻点完成";
  });

  $("sheetCancel").addEventListener("click", closeSheet);
  $("sheetMask").addEventListener("click", (e) => { if (e.target === $("sheetMask")) closeSheet(); });
  $("sheetDone").addEventListener("click", () => { const id = selectedId; closeSheet(); toggleDone(id); });
  $("sheetEdit").addEventListener("click", () => { const id = selectedId; closeSheet(); openEdit(id); });
  $("sheetDel").addEventListener("click", () => { const id = selectedId; closeSheet(); deleteItem(id, true); });

  $("editCancel").addEventListener("click", closeEdit);
  $("editMask").addEventListener("click", (e) => { if (e.target === $("editMask")) closeEdit(); });
  $("editSave").addEventListener("click", saveEdit);

  $("settingsBtn").addEventListener("click", () => {
    updateNotifUI();
    $("settingsMask").classList.add("show");
  });
  $("settingsClose").addEventListener("click", () => $("settingsMask").classList.remove("show"));
  $("settingsMask").addEventListener("click", (e) => {
    if (e.target === $("settingsMask")) $("settingsMask").classList.remove("show");
  });

  $("notifSwitch").addEventListener("click", async () => {
    if (settings.remindersEnabled && notifPerm() === "granted") {
      settings.remindersEnabled = false;
      saveSettings();
      await syncReminders();
      updateNotifUI();
      render();
      toast("已关闭提醒");
      return;
    }
    const granted = await requestNotifPermission();
    settings.remindersEnabled = granted;
    saveSettings();
    await syncReminders();
    updateNotifUI();
    render();
    toast(granted ? "提醒已开启" : "未开启提醒");
  });

  $("defaultRemind").addEventListener("change", async () => {
    settings.defaultRemindMin = +$("defaultRemind").value;
    saveSettings();
    await syncReminders();
    updateNotifUI();
    render();
  });

  $("btnTestNotif").addEventListener("click", async () => {
    const granted = await requestNotifPermission();
    if (!granted) return;
    try {
      if (swReg) {
        await swReg.showNotification("滚滚日程", {
          body: "测试通知：若看到这条，提醒通道可用。",
          tag: "rd-test",
          icon: "./icons/icon-192.png"
        });
      } else {
        new Notification("滚滚日程", { body: "测试通知：若看到这条，提醒通道可用。" });
      }
      toast("已发送测试通知");
    } catch (e) {
      toast("发送失败：" + (e.message || e));
    }
  });

  $("btnClear").addEventListener("click", async () => {
    if (!confirm("确定清空全部日程和待办？此操作不可撤销。")) return;
    store = { items: [], updatedAt: "" };
    saveStore();
    render();
    $("settingsMask").classList.remove("show");
  });

  $("btnExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(Object.assign({ version: 2, settings: settings }, store), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rollingday-" + nowParts().date + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  $("btnImport").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.items)) throw new Error("缺少 items 数组");
      if (!confirm("导入 " + data.items.length + " 条记录，将覆盖当前数据。继续？")) return;
      store = {
        items: data.items.map((it) => makeItem(it)),
        updatedAt: data.updatedAt || new Date().toISOString()
      };
      if (data.settings) {
        settings.remindersEnabled = !!data.settings.remindersEnabled;
        if (REMIND_OPTS.includes(+data.settings.defaultRemindMin)) {
          settings.defaultRemindMin = +data.settings.defaultRemindMin;
        }
        saveSettings();
      }
      saveStore();
      render();
      $("settingsMask").classList.remove("show");
    } catch (err) {
      alert("导入失败：" + (err && err.message ? err.message : err));
    }
  });

  rdAutoScroll(vp, {
    step: 0.45,
    idleMs: 5000,
    hintEl: $("scrollHint"),
    blocked: function () { return !!openSwipeId || !!gesture.el || $("editMask").classList.contains("show"); }
  });

  setInterval(render, 30000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") syncReminders();
  });

  render();
  updateNotifUI();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(async (reg) => {
      swReg = reg;
      await syncReminders();
    }).catch(() => {});
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (e.data && e.data.type === "notification-click") {
        /* focus already handled by SW */
      }
    });
  } else {
    syncReminders();
  }
})();
</script>
</body>
</html>
