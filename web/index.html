<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>RollingDay</title>
<style>
body{margin:0;background:#111;color:#ddd;font:15px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:#8af}
#hd{position:sticky;top:0;background:#1b1b1b;padding:8px 12px;border-bottom:1px solid #333;z-index:2}
#now{font-weight:bold;color:#7fd}
#nx{color:#aaa;font-size:13px}
#err{color:#f77;font-size:13px;white-space:pre-wrap}
#vp{height:calc(100vh - 74px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#scrollHint{display:none;position:fixed;right:10px;bottom:10px;z-index:5;background:rgba(20,57,47,.92);color:#9fe;font-size:11px;padding:3px 8px;border-radius:10px;pointer-events:none}
h3{margin:12px 12px 4px;color:#8af;font-size:14px}
.b{margin:3px 10px;padding:6px 9px;border-radius:6px;background:#1e1e1e;border-left:3px solid #555}
.b.cls{border-color:#a7f}
.b.cur{background:#14392f;border-color:#3e9}
.b.past{opacity:.45}
.t{color:#9ab;font-size:12px}
.dn{text-decoration:line-through;opacity:.5}
.b input{float:right;transform:scale(1.4);margin:4px}
.p高{border-color:#e55}
.p中{border-color:#eb5}
.p低{border-color:#6a6}
#ft{font-size:11px;color:#666;padding:4px 12px}
.row{position:relative;margin:3px 10px;border-radius:6px;overflow:hidden;touch-action:pan-y}
.row .b{margin:0;position:relative;z-index:1;transition:transform .18s ease;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.row .b.dragging{transition:none}
.row-actions{position:absolute;top:0;right:0;bottom:0;width:132px;display:flex;z-index:0}
.row-actions button{flex:1;border:none;color:#fff;font-size:14px;font-weight:600}
.act-edit{background:#2a6}.act-del{background:#c33}
.b.pend{box-shadow:inset 0 0 0 1px #3e9}
.mask{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:20;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{width:100%;max-width:480px;background:#1c1c1c;border-radius:14px 14px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #333;max-height:90vh;overflow:auto;box-sizing:border-box}
.sheet h2{margin:0 0 10px;font-size:16px;color:#7fd}
.fr{margin-bottom:8px}.fr label{display:block;font-size:12px;color:#9ab;margin-bottom:3px}
.fr input,.fr select{width:100%;box-sizing:border-box;background:#111;color:#ddd;border:1px solid #333;border-radius:8px;padding:9px;font-size:16px}
.fg{display:flex}.fg .fr{flex:1}.fg .fr+.fr{margin-left:8px}
.sbtn{display:block;width:100%;padding:13px;margin:5px 0;border:none;border-radius:10px;background:#2a2a2a;color:#ddd;font-size:16px}
.sbtn.pri{background:#1a8f7a;color:#fff;font-weight:600}.sbtn.dng{color:#f66}
</style>
</head>
<body>
<div id="hd">
  <div id="now">加载中...</div>
  <div id="nx"></div>
  <div id="err"></div>
</div>
<div id="vp"><div id="c"></div></div>
<div id="scrollHint">已暂停自动滚动</div>
<div id="editMask" class="mask" role="dialog" aria-modal="true"><div class="sheet">
<h2 id="eHead">编辑</h2>
<div id="eTimeRow" class="fg"><div class="fr"><label for="eStart">开始</label><input id="eStart" type="time"></div><div class="fr"><label for="eEnd">结束</label><input id="eEnd" type="time"></div></div>
<div class="fr"><label for="eTitle">内容</label><input id="eTitle" type="text" maxlength="200"></div>
<div id="eTodoRow"><div class="fg"><div class="fr"><label for="eDue">截止</label><input id="eDue" type="text" placeholder="YYYY-MM-DD / 无截止"></div><div class="fr"><label for="ePri">优先级</label><select id="ePri"><option>高</option><option>中</option><option>低</option></select></div></div>
<div class="fr"><label for="eNote">备注</label><input id="eNote" type="text" maxlength="300"></div></div>
<button type="button" class="sbtn pri" id="eSave">保存</button>
<button type="button" class="sbtn dng" id="eDel">删除</button>
<button type="button" class="sbtn" id="eCancel">取消</button>
</div></div>

<script>
/* RollingDay gestures (ported from docs/app): swipe-left reveals 编辑/删除,
   long-press opens the edit sheet. Pointer events where available, touch +
   mouse fallback otherwise. Vertical drags are handed to native scrolling.
   ES2017-safe (no ?. / ??). */
function rdGestures(c, opts) {
  var ACTION_W = opts.actionW || 132;
  var g = { id: null, el: null, sx: 0, sy: 0, dx: 0, dy: 0, moved: false, swiping: false, long: null, fired: false, baseX: 0 };
  var api = { openId: null, active: function () { return !!g.el; } };
  var lastLongFireAt = 0;
  function ptX(e) { if (e.touches && e.touches[0]) return e.touches[0].clientX; if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientX; return e.clientX || 0; }
  function ptY(e) { if (e.touches && e.touches[0]) return e.touches[0].clientY; if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientY; return e.clientY || 0; }
  function card(t) { return t && t.closest ? t.closest(".b[data-id]") : null; }
  function setX(el, x) { el.style.transform = x ? "translateX(" + x + "px)" : ""; el.style.webkitTransform = el.style.transform; }
  api.closeAll = function (exceptId) {
    var els = c.querySelectorAll(".b[data-id]");
    for (var i = 0; i < els.length; i++) if (els[i].getAttribute("data-id") !== exceptId) setX(els[i], 0);
    api.openId = exceptId || null;
  };
  api.restore = function () { /* re-apply open swipe after a re-render */
    if (!api.openId) return;
    var el = c.querySelector('.b[data-id="' + api.openId + '"]');
    if (el) setX(el, -ACTION_W); else api.openId = null;
  };
  function down(e) {
    if (e.button && e.button !== 0) return;
    var cd = card(e.target);
    if (!cd) return;
    if (e.target.closest(".row-actions") || e.target.closest("input,button,a,select")) return;
    var id = cd.getAttribute("data-id");
    g.id = id; g.el = cd; g.sx = ptX(e); g.sy = ptY(e); g.dx = 0; g.dy = 0;
    g.moved = false; g.swiping = false; g.fired = false;
    g.baseX = api.openId === id ? -ACTION_W : 0;
    cd.classList.add("dragging");
    clearTimeout(g.long);
    g.long = setTimeout(function () {
      if (g.moved || g.swiping || !g.el) return;
      g.fired = true; lastLongFireAt = Date.now();
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
      api.closeAll(); opts.onEdit(id);
    }, 480);
  }
  function move(e) {
    if (!g.el) return;
    g.dx = ptX(e) - g.sx; g.dy = ptY(e) - g.sy;
    var adx = Math.abs(g.dx), ady = Math.abs(g.dy);
    if (!g.moved && (adx > 8 || ady > 8)) { g.moved = true; clearTimeout(g.long); }
    if (!g.swiping && ady > 10 && ady >= adx) { /* vertical: native scroll */
      g.el.classList.remove("dragging"); g.el = null; return;
    }
    if (!g.swiping && adx > 10 && adx > ady * 1.5) {
      g.swiping = true;
      if (api.openId && api.openId !== g.id) api.closeAll(g.id);
    }
    if (g.swiping) {
      var tx = g.baseX + g.dx;
      if (tx > 0) tx = 0;
      if (tx < -ACTION_W) tx = -ACTION_W;
      setX(g.el, tx);
      if (e.cancelable) e.preventDefault();
    }
  }
  function up() {
    clearTimeout(g.long);
    if (!g.el) return;
    var el = g.el, id = g.id;
    el.classList.remove("dragging"); g.el = null;
    if (g.fired) return;
    if (g.swiping) {
      var open = g.baseX + g.dx < -ACTION_W / 2;
      setX(el, open ? -ACTION_W : 0);
      api.openId = open ? id : (api.openId === id ? null : api.openId);
      return;
    }
    if (!g.moved) {
      if (api.openId) api.closeAll();
      else if (opts.onTap) opts.onTap(id);
    }
  }
  function cancel() {
    clearTimeout(g.long);
    if (g.el) { g.el.classList.remove("dragging"); if (g.swiping) setX(g.el, api.openId === g.id ? -ACTION_W : 0); }
    g.el = null;
  }
  if (window.PointerEvent) {
    c.addEventListener("pointerdown", down);
    c.addEventListener("pointermove", move);
    c.addEventListener("pointerup", up);
    c.addEventListener("pointercancel", cancel);
  } else {
    var lastTouch = 0;
    var tw = function (fn) { return function (e) { lastTouch = Date.now(); fn(e); }; };
    var mw = function (fn) { return function (e) { if (Date.now() - lastTouch < 800) return; fn(e); }; };
    c.addEventListener("touchstart", tw(down), { passive: true });
    c.addEventListener("touchmove", tw(move), { passive: false });
    c.addEventListener("touchend", tw(up));
    c.addEventListener("touchcancel", tw(cancel));
    c.addEventListener("mousedown", mw(down));
    window.addEventListener("mousemove", mw(move));
    window.addEventListener("mouseup", mw(up));
  }
  c.addEventListener("touchmove", function (e) { if (g.swiping && g.el && e.cancelable) e.preventDefault(); }, { passive: false });
  /* swallow the click synthesized after a long-press so it can't hit the sheet */
  c.addEventListener("touchend", function (e) {
    if (lastLongFireAt && Date.now() - lastLongFireAt < 5000) { lastLongFireAt = 0; if (e.cancelable) e.preventDefault(); }
  }, { passive: false });
  c.addEventListener("contextmenu", function (e) {
    var cd = card(e.target);
    if (!cd) return;
    e.preventDefault();
    if (Date.now() - lastLongFireAt < 1500) return; /* long-press already opened it */
    clearTimeout(g.long); g.el = null; api.closeAll();
    opts.onEdit(cd.getAttribute("data-id"));
  });
  c.addEventListener("click", function (e) {
    var act = e.target.closest ? e.target.closest("[data-act]") : null;
    if (act) {
      e.preventDefault(); e.stopPropagation();
      var id = act.getAttribute("data-id");
      api.closeAll();
      if (act.getAttribute("data-act") === "edit") opts.onEdit(id); else opts.onDel(id);
    }
  });
  document.addEventListener("click", function (e) {
    if (api.openId && !(e.target.closest && e.target.closest(".row"))) api.closeAll();
  });
  return api;
}
/* ---- edits.json: optimistic edit/delete, written back to the gist ---- */
var EDITS = [], editsW = 0;
function rdApplyEdits(s, edits) { /* returns a copy of s with edits overlaid */
  var o = JSON.parse(JSON.stringify(s));
  for (var i = 0; i < edits.length; i++) {
    var e = edits[i], f = e.fields || {}, k, j, d;
    if (e.type !== "block") {
      for (j = 0; j < o.todos.length; j++) if (o.todos[j].id === e.id) {
        if (e.action === "delete") o.todos.splice(j, 1);
        else { for (k in f) if (["title", "due", "priority", "note"].indexOf(k) >= 0) o.todos[j][k] = f[k]; o.todos[j].pend = 1; }
        break;
      }
    }
    if (e.type !== "todo") {
      for (d = 0; d < o.days.length; d++) {
        var bl = o.days[d].blocks;
        for (j = 0; j < bl.length; j++) if (bl[j].id === e.id) {
          if (e.action === "delete") bl.splice(j, 1);
          else { for (k in f) if (["title", "start", "end"].indexOf(k) >= 0 && f[k]) bl[j][k] = f[k]; bl[j].pend = 1; }
          bl.sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
          break;
        }
      }
    }
  }
  return o;
}
function rdFindItem(s, id) {
  for (var j = 0; j < s.todos.length; j++) if (s.todos[j].id === id) return { type: "todo", it: s.todos[j] };
  for (var d = 0; d < s.days.length; d++) for (var b = 0; b < s.days[d].blocks.length; b++)
    if (s.days[d].blocks[b].id === id) return { type: "block", it: s.days[d].blocks[b], day: s.days[d] };
  return null;
}
function rdMergeEdit(list, e) { /* one pending edit per item: later edits merge into earlier */
  var out = [], prev = null;
  for (var i = 0; i < list.length; i++) { if (list[i].id === e.id && list[i].type === e.type) prev = list[i]; else out.push(list[i]); }
  if (prev && prev.action === "edit" && e.action === "edit") e.fields = Object.assign({}, prev.fields || {}, e.fields || {});
  out.push(e);
  return out;
}
const LS_GIST = "rollingday.gist";
const LS_TZ = "rollingday.timezone";
const LS_TOKEN = "rollingday.githubToken";
const LS_DEMO_DONE = "rollingday.demoDone";
const LS_DEMO_EDITS = "rollingday.demoEdits";
let S = null, V = null, DONE = new Set(), pend = {}, lastW = 0, dirty = false;

function query() {
  return new URLSearchParams(location.search);
}

function configure() {
  const q = query();
  const gistParam = (q.get("gist") || "").trim();
  const ownerParam = (q.get("owner") || "").trim();
  const idParam = (q.get("id") || q.get("gist_id") || "").trim();
  const tzParam = (q.get("tz") || q.get("timezone") || "").trim();
  if (gistParam) localStorage.setItem(LS_GIST, gistParam);
  else if (ownerParam && idParam) localStorage.setItem(LS_GIST, ownerParam + "/" + idParam);
  else if (idParam) localStorage.setItem(LS_GIST, idParam);
  if (tzParam) localStorage.setItem(LS_TZ, tzParam);
  return {
    demo: isDemo(),
    gist: parseGist(localStorage.getItem(LS_GIST) || ""),
    timezone: localStorage.getItem(LS_TZ) || "Asia/Shanghai"
  };
}

function isDemo() {
  const v = (query().get("demo") || "").toLowerCase();
  return v === "1" || v === "true" || v === "yes";
}

function scrollStep() {
  const v = parseFloat(query().get("scroll") || "0.5");
  return Number.isFinite(v) && v > 0 ? v : 0.5;
}

function parseGist(v) {
  const raw = (v || "").trim().replace(/^https:\/\/gist\.github\.com\//, "");
  const parts = raw.split("/").filter(Boolean);
  if (parts.length >= 2) return { owner: parts[0], id: parts[1], label: parts[0] + "/" + parts[1] };
  if (parts.length === 1) return { owner: "", id: parts[0], label: parts[0] };
  return { owner: "", id: "", label: "" };
}

function nowParts(timezone) {
  const p = {};
  const fmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: timezone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
  for (const x of fmt.formatToParts(new Date())) p[x.type] = x.value;
  return { date: `${p.year}-${p.month}-${p.day}`, hm: `${p.hour}:${p.minute}` };
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  })[c]);
}

function isDone(t) {
  if (isDemo() && localStorage.getItem(LS_DEMO_DONE)) return DONE.has(t.id);
  return t.id in pend ? pend[t.id] : (DONE.has(t.id) || t.done);
}

async function fetchGistFile(name, token) {
  const cfg = configure();
  if (cfg.demo) {
    const demoPath = `../examples/${encodeURIComponent(name)}?t=${Date.now()}`;
    const local = await fetch(demoPath, { cache: "no-store" });
    if (!local.ok) throw new Error(`demo 文件读取失败：${name} HTTP ${local.status}`);
    return await local.text();
  }
  if (!cfg.gist.id) throw new Error("请在 URL 中加入 ?gist=owner/gist_id，或 ?gist=gist_id");
  const headers = token ? { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" } : {};
  if (cfg.gist.owner) {
    const rawUrl = `https://gist.githubusercontent.com/${encodeURIComponent(cfg.gist.owner)}/${encodeURIComponent(cfg.gist.id)}/raw/${encodeURIComponent(name)}?t=${Date.now()}`;
    const raw = await fetch(rawUrl, { cache: "no-store", headers: token ? headers : {} });
    if (raw.ok) return await raw.text();
  }
  const api = await fetch(`https://api.github.com/gists/${encodeURIComponent(cfg.gist.id)}?t=${Date.now()}`, {
    cache: "no-store",
    headers
  });
  if (!api.ok) throw new Error("读取 gist 失败 HTTP " + api.status);
  const g = await api.json();
  if (!g.files || !g.files[name]) throw new Error(`gist 中缺少 ${name}`);
  return g.files[name].content || "";
}

function rowHtml(id, cls, inner) {
  return `<div class="row"><div class="row-actions"><button type="button" class="act-edit" data-act="edit" data-id="${esc(id)}">编辑</button>` +
    `<button type="button" class="act-del" data-act="del" data-id="${esc(id)}">删除</button></div><div class="${cls}" data-id="${esc(id)}">${inner}</div></div>`;
}
function render(s0) {
  if (!s0) return;
  if (typeof G !== "undefined" && G && (G.active() || sheetOpen())) { dirty = true; return; }
  dirty = false;
  const s = V = rdApplyEdits(Object.assign({ days: [], todos: [] }, s0), EDITS);
  const cfg = configure();
  const n = nowParts(cfg.timezone);
  let h = "", cur = null, nxt = null;
  for (const d of (s.days || [])) {
    if (d.date < n.date) continue;
    h += `<h3>${esc(d.label || d.date)}</h3>`;
    for (const b of (d.blocks || [])) {
      let k = "b" + (b.kind === "class" ? " cls" : "") + (b.pend ? " pend" : "");
      if (d.date === n.date) {
        if (b.start <= n.hm && n.hm < b.end) {
          k += " cur"; cur = b;
        } else if (b.end && b.end <= n.hm) {
          k += " past";
        } else if (!nxt && b.kind !== "note") {
          nxt = b;
        }
      } else if (!nxt && !cur && b.kind !== "note") {
        nxt = Object.assign({}, b, { start: (d.label || d.date) + " " + b.start });
      }
      const inner = `<div class="t">${esc(b.start)}${b.end ? "–" + esc(b.end) : ""}</div>${esc(b.title)}`;
      h += b.id ? rowHtml(b.id, k, inner) : `<div class="${k}">${inner}</div>`;
    }
  }
  h += "<h3>待办</h3>";
  for (const t of (s.todos || [])) {
    const d = isDone(t);
    h += rowHtml(t.id, `b p${esc(t.priority || "中")}${d ? " dn" : ""}${t.pend ? " pend" : ""}`,
      `<input type="checkbox" ${d ? "checked" : ""} onclick="event.stopPropagation();tog('${esc(t.id)}',this.checked)">` +
      `<div class="t">${esc(t.due || "")} · ${esc(t.priority || "中")}</div>${esc(t.title)}`);
  }
  h += `<div id="ft">更新于 ${esc(s.updated_at || "")} · ${cfg.demo ? "demo 本地模式" : "gist " + esc(cfg.gist.label || "未配置")} · 左滑编辑/删除 · 长按编辑 · ` +
    `<a href="#" onclick="localStorage.removeItem('${LS_TOKEN}');alert('已清除 token');return false">重置 token</a></div>`;
  document.getElementById("c").innerHTML = h;
  document.getElementById("now").textContent = cur ? `现在：${cur.title}（至 ${cur.end}）` : "现在：空闲";
  document.getElementById("nx").textContent = nxt ? `下一项：${nxt.start} ${nxt.title}` : "";
  if (typeof G !== "undefined" && G) G.restore();
}

async function tog(id, v) {
  const cfg = configure();
  pend[id] = v;
  const t = ((V || S).todos || []).find(x => x.id === id);
  if (!t) return;
  const t0 = (S.todos || []).find(x => x.id === id);
  if (t0) t0.done = false;
  render(S);
  const err = document.getElementById("err");
  err.textContent = "";
  if (cfg.demo) {
    if (v) DONE.add(id); else DONE.delete(id);
    localStorage.setItem(LS_DEMO_DONE, JSON.stringify([...DONE]));
    delete pend[id];
    render(S);
    return;
  }
  let token = localStorage.getItem(LS_TOKEN);
  if (!token) {
    token = prompt("输入 GitHub token（gist 权限，仅存本机 localStorage）");
    if (!token) { delete pend[id]; render(S); return; }
    token = token.trim();
    localStorage.setItem(LS_TOKEN, token);
  }
  try {
    const headers = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };
    const g = await (await fetch(`https://api.github.com/gists/${encodeURIComponent(cfg.gist.id)}`, { headers, cache: "no-store" })).json();
    if (!g.files) throw new Error(g.message || "读取失败");
    let d = { done: [] };
    try { d = JSON.parse((g.files["done.json"] || {}).content || "{\"done\":[]}"); } catch (e) {}
    d.done = (d.done || []).filter(x => x.id !== id);
    if (v) d.done.push({ id: id, title: t.title, at: new Date().toISOString() });
    const r = await fetch(`https://api.github.com/gists/${encodeURIComponent(cfg.gist.id)}`, {
      method: "PATCH",
      headers,
      body: JSON.stringify({ files: { "done.json": { content: JSON.stringify(d, null, 1) } } })
    });
    if (!r.ok) throw new Error("写入失败 HTTP " + r.status);
    DONE = new Set(d.done.map(x => x.id));
    lastW = Date.now();
    delete pend[id];
    render(S);
  } catch (e) {
    delete pend[id];
    render(S);
    err.textContent = "勾选失败：" + e.message;
  }
}

async function load() {
  try {
    const cfg = configure();
    const scheduleText = await fetchGistFile("schedule.json");
    S = JSON.parse(scheduleText);
    if (Date.now() - lastW > 180000) {
      try {
        const doneText = await fetchGistFile("done.json");
        DONE = new Set((JSON.parse(doneText).done || []).map(x => x.id));
        if (cfg.demo && localStorage.getItem(LS_DEMO_DONE)) {
          DONE = new Set(JSON.parse(localStorage.getItem(LS_DEMO_DONE) || "[]"));
        }
      } catch (e) {}
    }
    if (cfg.demo) {
      EDITS = JSON.parse(localStorage.getItem(LS_DEMO_EDITS) || "[]");
    } else if (Date.now() - editsW > 180000) {
      try { EDITS = JSON.parse(await fetchGistFile("edits.json")).edits || []; } catch (e) {}
    }
    document.getElementById("err").textContent = "";
    render(S);
  } catch (e) {
    document.getElementById("nx").textContent = "";
    document.getElementById("err").textContent = "加载失败：" + e.message;
  }
}

/* ---- edit / delete: optimistic overlay + write-back to edits.json ---- */
let editQ = Promise.resolve();
function rdUndo(list, e) { return list.filter(function (x) { return x.eid !== e.eid; }); }
function getToken() {
  let token = localStorage.getItem(LS_TOKEN);
  if (!token) {
    token = prompt("输入 GitHub token（gist 权限，仅存本机 localStorage）");
    if (!token) return null;
    token = token.trim();
    localStorage.setItem(LS_TOKEN, token);
  }
  return token;
}
function pushEdit(e) {
  EDITS = rdMergeEdit(EDITS, e);
  editsW = Date.now();
  render(S);
  editQ = editQ.then(function () { return writeEdit(e); });
  return editQ;
}
async function writeEdit(e) {
  const cfg = configure();
  const err = document.getElementById("err");
  err.textContent = "";
  if (cfg.demo) { localStorage.setItem(LS_DEMO_EDITS, JSON.stringify(EDITS)); return; }
  const token = getToken();
  if (!token) { EDITS = rdUndo(EDITS, e); render(S); return; }
  try {
    const api = `https://api.github.com/gists/${encodeURIComponent(cfg.gist.id)}`;
    const headers = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };
    const g = await (await fetch(api, { headers, cache: "no-store" })).json();
    if (!g.files) throw new Error(g.message || "读取失败");
    let d = { edits: [] };
    try { d = JSON.parse((g.files["edits.json"] || {}).content || "{\"edits\":[]}"); } catch (x) {}
    d.edits = rdMergeEdit(d.edits || [], e);
    const r = await fetch(api, {
      method: "PATCH",
      headers,
      body: JSON.stringify({ files: { "edits.json": { content: JSON.stringify(d, null, 1) } } })
    });
    if (!r.ok) throw new Error("写入失败 HTTP " + r.status);
    EDITS = d.edits;
    editsW = Date.now();
    render(S);
  } catch (x) {
    EDITS = rdUndo(EDITS, e);
    render(S);
    err.textContent = (e.action === "delete" ? "删除" : "编辑") + "失败：" + x.message;
  }
}
function newEdit(id, type, action, fields) {
  return { eid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), id: id, type: type, action: action, fields: fields || {}, at: new Date().toISOString() };
}
let editing = null;
function $id(x) { return document.getElementById(x); }
function sheetOpen() { return $id("editMask").classList.contains("show"); }
function openEdit(id) {
  const f = V && rdFindItem(V, id);
  if (!f) return;
  editing = f;
  const it = f.it, todo = f.type === "todo";
  $id("eHead").textContent = todo ? "编辑待办" : "编辑日程" + (f.day ? " · " + (f.day.label || f.day.date) : "");
  $id("eTimeRow").style.display = todo ? "none" : "";
  $id("eTodoRow").style.display = todo ? "" : "none";
  $id("eStart").value = todo || it.start === "--:--" ? "" : (it.start || "");
  $id("eEnd").value = todo ? "" : (it.end || "");
  $id("eTitle").value = it.title || "";
  if (todo) { $id("eDue").value = it.due || ""; $id("ePri").value = it.priority || "中"; $id("eNote").value = it.note || ""; }
  $id("editMask").classList.add("show");
}
function closeEdit() { $id("editMask").classList.remove("show"); editing = null; if (dirty) render(S); }
function delItem(id) {
  const f = V && rdFindItem(V, id);
  if (!f) return;
  if (!confirm("删除「" + f.it.title + "」？")) return;
  pushEdit(newEdit(id, f.type, "delete"));
}
$id("eCancel").addEventListener("click", closeEdit);
$id("editMask").addEventListener("click", function (e) { if (e.target === $id("editMask")) closeEdit(); });
$id("eDel").addEventListener("click", function () { const f = editing; if (!f) return; closeEdit(); delItem(f.it.id); });
$id("eSave").addEventListener("click", function () {
  const f = editing;
  if (!f) return;
  const title = $id("eTitle").value.trim();
  if (!title) { alert("内容不能为空"); return; }
  let fields;
  if (f.type === "todo") {
    fields = { title: title, due: $id("eDue").value.trim(), priority: $id("ePri").value, note: $id("eNote").value.trim() };
  } else {
    fields = { title: title };
    const st = $id("eStart").value, en = $id("eEnd").value;
    if ((st && !en) || (!st && en)) { alert("开始和结束时间需同时填写"); return; }
    if (st && en && en <= st) { alert("结束时间需晚于开始"); return; }
    if (st) { fields.start = st; fields.end = en; }
  }
  const id = f.it.id;
  closeEdit();
  pushEdit(newEdit(id, f.type, "edit", fields));
});
const G = rdGestures(document.getElementById("c"), { actionW: 132, onEdit: openEdit, onDel: delItem });

load();
setInterval(load, 60000);
const vp = document.getElementById("vp");
/* RollingDay auto-scroll: native scrolling + pause on interaction, resume after idle */
function rdAutoScroll(vp, opts) {
  opts = opts || {};
  var step = opts.step || 0.5;
  var idleMs = opts.idleMs || 5000;
  var hintEl = opts.hintEl || null;
  var blocked = opts.blocked || function () { return false; };
  var pos = vp.scrollTop;
  var lastSet = -1;
  var pausedUntil = 0;
  var wasPaused = false;
  function showHint(on) {
    if (!hintEl) return;
    hintEl.style.display = on ? "block" : "none";
  }
  function pause() {
    pausedUntil = Date.now() + idleMs;
    if (!wasPaused) { wasPaused = true; showHint(true); }
  }
  var evs = ["touchstart", "touchmove", "wheel", "pointerdown", "mousedown", "keydown"];
  for (var i = 0; i < evs.length; i++) {
    vp.addEventListener(evs[i], pause, { passive: true });
  }
  vp.addEventListener("scroll", function () {
    // Ignore scroll events caused by our own scrollTop writes
    if (Math.abs(vp.scrollTop - lastSet) <= 2) return;
    pause();
  }, { passive: true });
  setInterval(function () {
    if (Date.now() < pausedUntil || blocked()) return;
    if (wasPaused) {
      wasPaused = false;
      showHint(false);
      pos = vp.scrollTop; // resume from where the user left it
    }
    var max = vp.scrollHeight - vp.clientHeight;
    if (max <= 0) { pos = 0; return; }
    pos += step;
    if (pos > max + 60) pos = -120;
    vp.scrollTop = Math.max(0, pos);
    lastSet = vp.scrollTop;
  }, 40);
  return { pause: pause };
}
rdAutoScroll(vp, { step: scrollStep(), idleMs: 5000, hintEl: document.getElementById("scrollHint"), blocked: function () { return sheetOpen() || !!G.openId; } });
</script>
